name: release
# Lancement manuel seulement (Actions > release > Run workflow, branche = tag vX.Y.Z).
# Les releases officielles (Windows + APK signé avec la clé de D:\MDP) sont publiées depuis le PC ;
# les paquets Linux (deb, rpm, AppImage) sont construits sur le PC (WSL) ; ce workflow AJOUTE à cette release le macOS (dmg universel, non signé),
# puis complète SHA256SUMS sans toucher aux fichiers déjà publiés.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos, cmd: "rustup target add x86_64-apple-darwin aarch64-apple-darwin && npm run tauri build -- --target universal-apple-darwin --bundles dmg", glob: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 22 }
      - name: Dépendances Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: npm ci
      - name: Tests Rust et IR
        if: matrix.name == 'linux'
        run: |
          (cd src-tauri && cargo test)
          node src/ir.test.mjs
      - run: ${{ matrix.cmd }}
      - name: Rassembler
        shell: bash
        run: |
          shopt -s globstar extglob nullglob
          mkdir out
          for f in ${{ matrix.glob }}; do cp "$f" out/; done
          ls out
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with: { name: "${{ matrix.name }}", path: out/*, if-no-files-found: error }

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { path: dist, merge-multiple: true }
      - name: Ajouter à la release et compléter SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir old && cd old
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          cd ../dist
          sha256sum * > ../nouveau.sums
          cat ../old/SHA256SUMS ../nouveau.sums | sort -u -k2 > SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --clobber
